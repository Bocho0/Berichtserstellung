<!doctype html><html lang="de"><head><title>Anmeldung</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:#E8E7E3;color:#1C1F22;margin:0;padding:24px}.c{max-width:760px;margin:auto;background:#fff;border-radius:12px;padding:24px;border-top:4px solid #A9925A}input,button{padding:9px 12px;font-size:14px;border-radius:7px;border:1px solid #CFCDC6}button{background:#1C1F22;color:#fff;cursor:pointer}button.s{background:#fff;color:#1C1F22}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.e{color:#B0413E}h1,h2{margin:.4em 0}</style></head><body><div class="c" style="max-width:380px">
<h1>NSI-Berichtserstellung</h1><div id="e" class="e"></div>
<div id="s1"><p><input id="u" placeholder="Firmenmail" style="width:100%"></p><p><input id="p" type="password" placeholder="Passwort" style="width:100%"></p><button onclick="go()">Anmelden</button></div>
<div id="s2" hidden><p>Code aus der Mail eingeben (10 Min. gültig):</p><p><input id="c" maxlength="6" inputmode="numeric" style="width:100%"></p><button onclick="ver()">Bestätigen</button></div></div>
<script>
const $=i=>document.getElementById(i);
async function post(b){const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});return[r.ok,await r.json()]}
async function go(){const[ok,d]=await post({action:'login',email:$('u').value,password:$('p').value});
 if(!ok){$('e').textContent=d.error;return}
 if(d.admin){location='/admin.html';return}$('e').textContent='';$('s1').hidden=true;$('s2').hidden=false}
async function ver(){const[ok,d]=await post({action:'verify',email:$('u').value,code:$('c').value});
 if(ok)location='/archiv.html';else$('e').textContent=d.error}
</script></body></html>
