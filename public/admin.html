<!doctype html><html lang="de"><head><title>Admin</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:#E8E7E3;color:#1C1F22;margin:0;padding:24px}.c{max-width:760px;margin:auto;background:#fff;border-radius:12px;padding:24px;border-top:4px solid #A9925A}input,button{padding:9px 12px;font-size:14px;border-radius:7px;border:1px solid #CFCDC6}button{background:#1C1F22;color:#fff;cursor:pointer}button.s{background:#fff;color:#1C1F22}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.e{color:#B0413E}h1,h2{margin:.4em 0}</style></head><body><div class="c">
<h1>Administration</h1><p><button class="s" onclick="out()">Abmelden</button></p><div id="e" class="e"></div>
<h2>Projekte</h2><p><input id="pc" placeholder="Kürzel" size="8"> <input id="pn" placeholder="Name" size="30"> <button onclick="a({action:'addProject',code:pc.value,name:pn.value})">Anlegen</button></p>
<h2>Mitarbeiter und Zugriffe</h2><p><input id="ue" placeholder="Firmenmail" size="34"> <button onclick="a({action:'addUser',email:ue.value})">Hinzufügen</button></p>
<div style="overflow:auto"><table id="t"></table></div>
<h2>Gesperrte Berichte</h2><div id="l"></div></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function a(b){const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});const d=await r.json();
 if(!r.ok){e.textContent=d.error;return}e.textContent='';render(d)}
function render(d){let h='<tr><th>Mail</th>'+d.projects.map(p=>'<th>'+esc(p.code)+' <a href="#" title="Projekt löschen" onclick="if(confirm(\'Projekt löschen?\'))a({action:\'delProject\',id:'+p.id+'});return false">✕</a></th>').join('')+'<th></th></tr>';
 for(const u of d.users)h+='<tr><td>'+esc(u.email)+'</td>'+d.projects.map(p=>'<td><input type="checkbox" '+(d.access.some(x=>x.email==u.email&&x.project_id==p.id)?'checked':'')+' onchange="a({action:\'assign\',email:\''+esc(u.email)+'\',id:'+p.id+',on:this.checked})"></td>').join('')+'<td><a href="#" onclick="if(confirm(\'Mitarbeiter löschen?\'))a({action:\'delUser\',email:\''+esc(u.email)+'\'});return false">Löschen</a></td></tr>';
 t.innerHTML=h;l.innerHTML=d.locks.length?d.locks.map(k=>esc(k.title)+' – '+esc(k.email)+' <button class="s" onclick="a({action:\'unlock\',id:'+k.report_id+'})">Freigeben</button>').join('<br>'):'Keine';
 pc.value=pn.value=ue.value=''}
async function out(){await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:'{"action":"logout"}'});location='/login.html'}
a();
</script></body></html>
